name: Firebase Hosting Cleanup

on:
  pull_request:
    types: [closed]

jobs:
  cleanup-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      - name: Delete Firebase Hosting Preview Channel
        run: |
          npm install -g firebase-tools
          firebase hosting:channel:delete pr-${{ github.event.pull_request.number }} \
            --project ${{ secrets.STAGING_FIREBASE_PROJECT_ID }} \
            --force
        continue-on-error: true
