name: Deploy to Staging

# develop is the staging branch: each push deploys it to the live channel of
# the staging project. The PR from develop to main promotes it to production.
# See issue #46.

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-client/package-lock.json

      - name: Install web-client dependencies
        run: npm ci
        working-directory: web-client

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build dictionary
        run: npm run build:dict

      # No Sentry DSN and no Analytics id: staging errors and visits stay out
      # of the production reports.
      - name: Build web-client
        run: npm run build
        working-directory: web-client
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.STAGING_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.STAGING_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STAGING_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.STAGING_FIREBASE_APP_ID }}

      - name: Check that the build does not reach production
        run: scripts/check-not-production.sh
        env:
          PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}

      - name: Build functions
        run: npm run build
        working-directory: functions

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # --force sets the Artifact Registry cleanup policy on the first deploy,
      # so the function images do not build up past the free 0.5 GB. It also
      # deletes a function that the source no longer has, without a prompt.
      - name: Deploy to Firebase
        run: firebase deploy --only hosting,functions,firestore:rules,firestore:indexes --project "$PROJECT_ID" --force
        env:
          PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
